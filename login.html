<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | FortiCore Technologies</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <span>FORTICORE</span>
                <small>TECHNOLOGIES INC.</small>
            </div>

            <a href="index.html" class="login-btn">
                Back to Home
            </a>
        </nav>
    </header>


    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-header">
                    <p class="hero-label">SECURE ACCESS</p>

                    <h1>Welcome Back</h1>

                    <p>
                        Sign in to access your FortiCore account.
                    </p>
                </div>


                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <button type="submit" class="primary-btn auth-btn">
                        Sign In
                    </button>

                </form>


                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <p class="auth-footer">
                    Don't have an account?
                    <a href="signup.html">Create one</a>
                </p>

            </div>

        </section>

    </main>


    <footer>
        <div class="footer-content">
            <div>
                <h3>FORTICORE</h3>
                <p>Technology with security at the core.</p>
            </div>

            <div>
                <p>© 2026 FortiCore Technologies Inc.</p>
            </div>
        </div>
    </footer>

</body>
</html>
