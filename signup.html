<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | FortiCore Technologies</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <span>FORTICORE</span>
                <small>TECHNOLOGIES INC.</small>
            </div>

            <a href="index.html" class="login-btn">
                Back to Home
            </a>
        </nav>
    </header>


    <!-- MAIN CONTENT -->
    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-header">
                    <p class="hero-label">JOIN FORTICORE</p>

                    <h1>Create Account</h1>

                    <p>
                        Create a secure FortiCore account.
                    </p>
                </div>


                <!-- SIGN UP FORM -->
                <form id="signupForm">

                    <!-- FULL NAME -->
                    <div class="form-group">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your full name"
                            required
                        >
                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            minlength="8"
                            required
                        >
                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">
                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="8"
                            required
                        >
                    </div>


                    <!-- CREATE ACCOUNT BUTTON -->
                    <button
                        type="submit"
                        class="primary-btn auth-btn"
                    >
                        Create Account
                    </button>

                </form>


                <!-- SIGN IN LINK -->
                <p class="auth-footer">
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>
        <div class="footer-content">

            <div>
                <h3>FORTICORE</h3>

                <p>
                    Technology with security at the core.
                </p>
            </div>

            <div>
                <p>
                    © 2026 FortiCore Technologies Inc.
                </p>
            </div>

        </div>
    </footer>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <!-- SIGN UP LOGIC -->
    <script>
        const signupForm = document.getElementById("signupForm");

        signupForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const name = document
                .getElementById("name")
                .value
                .trim();

            const email = document
                .getElementById("email")
                .value
                .trim();

            const password = document
                .getElementById("password")
                .value;

            const confirmPassword = document
                .getElementById("confirmPassword")
                .value;


            /* CHECK PASSWORD MATCH */

            if (password !== confirmPassword) {

                alert("Passwords do not match.");

                return;
            }


            /* CHECK PASSWORD LENGTH */

            if (password.length < 8) {

                alert(
                    "Password must be at least 8 characters long."
                );

                return;
            }


            /* CREATE SUPABASE ACCOUNT */

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            full_name: name
                        }

                    }

                });


            /* HANDLE ERROR */

            if (error) {

                alert(
                    "Account creation failed: "
                    + error.message
                );

                return;
            }


            /* SUCCESS */

            alert(
                "Account created successfully! " +
                "Please check your email to confirm your account."
            );


            /* GO TO LOGIN */

            window.location.href = "login.html";

        });
    </script>

</body>
</html>
